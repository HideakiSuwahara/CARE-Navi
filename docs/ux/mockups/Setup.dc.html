<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ケアナビ 設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D5C8A}a:hover{color:#164766}
</style>
</helmet>
<div style="font-family: 'Noto Sans JP', system-ui, sans-serif; background: #F3F3EF; color: #1C1F23; min-height: 900px; display: flex; flex-direction: column; box-sizing: border-box; font-size: 15px; line-height: 1.5;">

  <header style="display: flex; align-items: center; gap: 20px; padding: 0 20px; min-height: 60px; background: #FFFFFF; border-bottom: 1px solid #E3E3DE; flex-wrap: wrap;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="7" fill="#1D5C8A"></rect><path d="M8 14h12M14 8v12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"></path></svg>
      <span style="font-weight: 700; font-size: 18px;">ケアナビ</span>
      <span style="color: #5B6168; font-size: 14px;">ひまわり苑</span>
    </div>
    <nav aria-label="主な画面" style="display: flex; gap: 4px;">
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; padding: 0 16px; border-radius: 8px; color: #3A4651;">ボード</a>
      <a href="Review.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; padding: 0 16px; border-radius: 8px; color: #3A4651;">業務の見直し</a>
      <a href="Setup.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; padding: 0 16px; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700;">設定</a>
    </nav>
  </header>

  <main style="display: flex; gap: 20px; padding: 20px; flex: 1 1 auto; flex-wrap: wrap; align-items: flex-start;">

    <!-- 左: はじめて開いたとき -->
    <section aria-label="はじめて開いたとき" style="flex: 1 1 420px; max-width: 520px; display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 14px; color: #5B6168;">はじめて開いたときの画面</div>
      <div style="background: #FFFFFF; border: 1px solid #E3E3DE; border-radius: 16px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px;">
        <div style="font-size: 22px; font-weight: 700;">仕事に、人を付ける。</div>
        <a href="Main.dc.html" style="display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 88px; padding: 0 20px; border-radius: 14px; background: #1D5C8A; color: #FFFFFF; text-decoration: none;"><span style="font-size: 20px; font-weight: 700;">サンプル施設で試す</span><span style="font-size: 15px;">入力なしで、すぐ触れます</span></a>
        <button type="button" style="min-height: 72px; padding: 0 20px; border: 1px solid #D9DAD4; border-radius: 14px; background: #FFFFFF; color: #1C1F23; font-family: inherit; font-size: 18px; font-weight: 700; text-align: left; cursor: pointer;">自分の施設で始める</button>
      </div>
    </section>

    <!-- 右: ふだんの設定 -->
    <section aria-label="ふだんの設定" style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 14px; color: #5B6168;">ふだんの設定</div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <div style="background: #FFFFFF; border: 1px solid #E3E3DE; border-radius: 12px; padding: 16px; display: flex; gap: 14px; align-items: center;">
          <div aria-label="施設コードのQRコードの表示位置" role="img" style="flex: 0 0 104px; height: 104px; border: 2px dashed #5B6168; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #3A4651; text-align: center;">QR</div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <div style="font-weight: 700;">スマホとつなぐ</div>
            <div>施設コード <span style="font-family: ui-monospace, monospace; font-weight: 700; font-size: 18px; letter-spacing: 0.08em;">HMWR-7K2Q</span></div>
            <div style="font-size: 14px; color: #5B6168;">職員のスマホで読み取ると、同じ時間割が出ます。</div>
          </div>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #E3E3DE; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
          <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px;">
            <legend style="font-weight: 700; padding: 0; margin-bottom: 6px;">スマホでの利用者の名前</legend>
            <div role="radiogroup" style="display: inline-flex; border: 1px solid #D9DAD4; border-radius: 8px; overflow: hidden;">
              <button type="button" role="radio" aria-checked="false" style="height: 44px; padding: 0 12px; border: 0; background: #FFFFFF; color: #3A4651; font-family: inherit; font-size: 15px; cursor: pointer;">田中 ハナ</button>
              <button type="button" role="radio" aria-checked="true" style="height: 44px; padding: 0 12px; border: 0; background: #1C1F23; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">203 田中</button>
              <button type="button" role="radio" aria-checked="false" style="height: 44px; padding: 0 12px; border: 0; background: #FFFFFF; color: #3A4651; font-family: inherit; font-size: 15px; cursor: pointer;">203</button>
            </div>
          </fieldset>
          <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer;"><input type="checkbox" checked style="width: 24px; height: 24px;"><span><span style="font-weight: 700;">初回の方だけの配置</span>を知らせる</span></label>
        </div>
      </div>

      <div style="background: #FFFFFF; border: 1px solid #E3E3DE; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="font-weight: 700;">名簿の貼り付け</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px;">利用者（名前, グループ, 部屋）<textarea rows="6" placeholder="田中 ハナ, さくらユニット, 203&#10;小林 ヨシオ, さくらユニット, 205" style="border: 1px solid #D9DAD4; border-radius: 8px; padding: 10px 12px; font-size: 15px; font-family: inherit; resize: vertical;"></textarea></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px;">職員（名前, 職種, 担当条件[任意], PHS[任意]）<textarea rows="6" placeholder="佐藤 みき, 介護福祉士, 入浴担当可, 201&#10;渡辺 さとし, 介護助手" style="border: 1px solid #D9DAD4; border-radius: 8px; padding: 10px 12px; font-size: 15px; font-family: inherit; resize: vertical;"></textarea></label>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 14px; color: #5B6168;">表計算からそのまま貼れます（カンマ・タブ）。読めない行は行番号で知らせ、ほかは取り込みます。</span>
          <button type="button" style="margin-left: auto; height: 48px; padding: 0 20px; border: 0; border-radius: 10px; background: #1D5C8A; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;">取り込む</button>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
