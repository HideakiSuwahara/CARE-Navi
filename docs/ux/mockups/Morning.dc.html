<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ケアナビ 今日の時間割を作る</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D5C8A}a:hover{color:#164766}
</style>
</helmet>
<div style="font-family: 'Noto Sans JP', system-ui, sans-serif; background: #F3F3EF; color: #1C1F23; min-height: 900px; display: flex; flex-direction: column; box-sizing: border-box; font-size: 15px; line-height: 1.5;">

  <header style="display: flex; align-items: center; gap: 20px; padding: 0 20px; min-height: 60px; background: #FFFFFF; border-bottom: 1px solid #E3E3DE; flex-wrap: wrap;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="7" fill="#1D5C8A"></rect><path d="M8 14h12M14 8v12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"></path></svg>
      <span style="font-weight: 700; font-size: 18px;">ケアナビ</span>
      <span style="color: #5B6168; font-size: 14px;">ひまわり苑</span>
    </div>
    <nav aria-label="主な画面" style="display: flex; gap: 4px;">
      <a href="Main.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; padding: 0 16px; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700;">ボード</a>
      <a href="Review.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; padding: 0 16px; border-radius: 8px; color: #3A4651;">業務の見直し</a>
      <a href="Setup.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; padding: 0 16px; border-radius: 8px; color: #3A4651;">設定</a>
    </nav>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
      <button type="button" aria-label="前の日" style="width: 44px; height: 44px; border: 1px solid #E3E3DE; background: #FFFFFF; border-radius: 8px; font-size: 18px; color: #3A4651; cursor: pointer;">‹</button>
      <span style="font-weight: 700; font-size: 16px;">11月3日（火）</span>
      <button type="button" aria-label="次の日" style="width: 44px; height: 44px; border: 1px solid #E3E3DE; background: #FFFFFF; border-radius: 8px; font-size: 18px; color: #3A4651; cursor: pointer;">›</button>
    </div>
  </header>

  <main style="padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto;">

    <!-- 帯: 今日の時間割を作る -->
    <section aria-label="今日の時間割を作る" style="background: #FFFFFF; border: 2px solid #1D5C8A; border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;">
        <h1 style="margin: 0; font-size: 22px;">今日の時間割を作る</h1>
        <span style="font-size: 15px; color: #3A4651;">先週の火曜と同じ番で並べました。違うところだけ直してください。</span>
      </div>

      <div style="display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start;">
        <!-- 出勤者と番 -->
        <div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
          <div style="font-size: 14px; color: #5B6168;">きょうの出勤者（番を押すと選べます）</div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 1px solid #D9DAD4; border-radius: 10px;"><span style="font-weight: 700; min-width: 3em;">佐藤</span><button type="button" style="flex: 1 1 auto; height: 44px; border: 1px solid #1D5C8A; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;">早番A</button></div>
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 1px solid #D9DAD4; border-radius: 10px;"><span style="font-weight: 700; min-width: 3em;">高橋</span><button type="button" style="flex: 1 1 auto; height: 44px; border: 1px solid #1D5C8A; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;">早番B</button></div>
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 1px solid #D9DAD4; border-radius: 10px;"><span style="font-weight: 700; min-width: 3em;">鈴木</span><button type="button" style="flex: 1 1 auto; height: 44px; border: 1px solid #1D5C8A; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;">日勤A</button></div>
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 1px solid #D9DAD4; border-radius: 10px;"><span style="font-weight: 700; min-width: 3em;">伊藤</span><button type="button" style="flex: 1 1 auto; height: 44px; border: 1px solid #1D5C8A; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;">日勤B</button></div>
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 1px solid #D9DAD4; border-radius: 10px;"><span style="font-weight: 700; min-width: 3em;">山本</span><button type="button" style="flex: 1 1 auto; height: 44px; border: 1px solid #1D5C8A; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;">日勤C</button></div>
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 1px solid #D9DAD4; border-radius: 10px;"><span style="font-weight: 700; min-width: 3em;">小川</span><button type="button" style="flex: 1 1 auto; height: 44px; border: 1px solid #1D5C8A; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;">日勤さくら</button></div>
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 1px solid #D9DAD4; border-radius: 10px;"><span style="font-weight: 700; min-width: 3em;">中村</span><button type="button" style="flex: 1 1 auto; height: 44px; border: 1px solid #1D5C8A; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;">看護</button></div>
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 1px solid #D9DAD4; border-radius: 10px;"><span style="font-weight: 700; min-width: 3em;">木村</span><button type="button" style="flex: 1 1 auto; height: 44px; border: 1px solid #1D5C8A; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;">遅番</button></div>
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 1px solid #D9DAD4; border-radius: 10px;"><span style="font-weight: 700; min-width: 3em;">斉藤</span><button type="button" style="flex: 1 1 auto; height: 44px; border: 1px solid #1D5C8A; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;">夜勤東</button></div>
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 1px solid #D9DAD4; border-radius: 10px;"><span style="font-weight: 700; min-width: 3em;">森</span><button type="button" style="flex: 1 1 auto; height: 44px; border: 1px solid #1D5C8A; border-radius: 8px; background: #E6F0F8; color: #1D5C8A; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;">夜勤さくら</button></div>
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border: 2px dashed #B5651D; border-radius: 10px; background: #FFF8F3;"><span style="font-weight: 700; min-width: 3em;">渡辺</span><button type="button" aria-pressed="true" style="flex: 1 1 auto; height: 44px; border: 1px solid #1C1F23; border-radius: 8px; background: #1C1F23; color: #FFFFFF; font-weight: 700; font-family: inherit; font-size: 15px; cursor: pointer;">休み</button></div>
            <button type="button" style="min-height: 58px; border: 1px dashed #9AA0A6; border-radius: 10px; background: #FFFFFF; color: #1C1F23; font-family: inherit; font-size: 15px; cursor: pointer;">＋ 応援の人</button>
          </div>
        </div>

        <!-- 業務表と決定 -->
        <div style="flex: 1 1 300px; max-width: 380px; display: flex; flex-direction: column; gap: 12px;">
          <div style="font-size: 14px; color: #5B6168;">業務表</div>
          <button type="button" style="min-height: 52px; padding: 0 16px; border: 1px solid #D9DAD4; border-radius: 10px; background: #FFFFFF; color: #1C1F23; text-align: left; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;">入浴日（火・金） ▾</button>
          <button type="button" style="min-height: 64px; border: 0; border-radius: 12px; background: #1D5C8A; color: #FFFFFF; font-family: inherit; font-size: 19px; font-weight: 700; cursor: pointer;">この内容で作る</button>
          <p style="margin: 0; font-size: 14px; color: #5B6168;">作ったあとも直せます。間違えたら「元に戻す」。</p>
        </div>
      </div>
    </section>

    <!-- 下: 空の時間割（うすく） -->
    <section aria-label="時間割（まだありません）" style="flex: 1 1 auto; background: #FFFFFF; border: 1px solid #E3E3DE; border-radius: 12px; opacity: 0.55; min-height: 360px; display: grid; grid-template-columns: 64px repeat(3, minmax(0, 1fr)); background-image: linear-gradient(#EEEEEA 1px, transparent 1px); background-size: 100% 60px;">
      <div style="padding: 10px; font-size: 14px; color: #5B6168;">7:00</div>
      <div style="padding: 10px 12px; font-weight: 700; border-left: 1px solid #EEEEEA;">東フロア</div>
      <div style="padding: 10px 12px; font-weight: 700; border-left: 1px solid #EEEEEA;">さくらユニット</div>
      <div style="padding: 10px 12px; font-weight: 700; border-left: 1px solid #EEEEEA;">共通</div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
